[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = arduino

build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17

build_flags =
    -std=gnu++20

lib_deps =
    EDP-Serial-ESP-IDF=symlink://../../..
    EDP-Serial=symlink://../../../../EDP-Serial
    EDP-System=symlink://../../../../EDP-System
